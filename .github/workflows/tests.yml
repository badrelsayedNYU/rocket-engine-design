name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  full-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Fortran compiler for RocketCEA
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Install model, compiled backend, and app test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev,cea,app]'
      - name: Require all optional validation backends
        run: python -c "import rocketcea, CoolProp, streamlit.testing.v1"
      - run: python -m pytest -q
