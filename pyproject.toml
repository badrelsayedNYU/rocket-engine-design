[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-engine-design"
version = "0.0.1"
description = "Transparent preliminary liquid rocket engine design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "CoolProp>=8.0", "PyYAML>=6"]

[project.optional-dependencies]
cea = ["rocketcea==1.2.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cea: requires the RocketCEA extra and exercises the compiled backend"]
